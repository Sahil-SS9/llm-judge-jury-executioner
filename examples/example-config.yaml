# Example LLM Council Configuration
# Copy this file and adjust providers/models to match your API keys.
#
# Set environment variables:
#   export OPENAI_API_KEY="sk-..."
#   export ANTHROPIC_API_KEY="sk-ant-..."
#   export GOOGLE_API_KEY="..."
#   # Or use OpenRouter as a unified provider:
#   export OPENROUTER_API_KEY="sk-or-..."

council:
  # Panel configuration
  panel_size: 3
  protocol: deliberate  # deliberate|vote|synthesize|critique|redteam|mav

  # Feature flags
  compose: true                # Phase 0: dynamic agent composition
  cross_examination: true      # Phase 2: cross-exam before ranking
  cascade_breaker: true       # Phase 2b: skeptic role
  minority_report: true        # Phase 3b: preserve dissent
  html_report: true            # Generate HTML visual report
  evidence_labels: true        # Tag claims with evidence types

  # Panel members — each runs on a different model for diversity
  panel:
    - provider: openai
      model: gpt-5
      fallback:
        - {provider: anthropic, model: claude-sonnet-4}

    - provider: anthropic
      model: claude-sonnet-4
      fallback:
        - {provider: openai, model: gpt-5}

    - provider: google
      model: gemini-3-pro
      fallback:
        - {provider: openrouter, model: anthropic/claude-sonnet-4}

  # Chairman — synthesizes the final verdict
  chairman:
    provider: openai
    model: gpt-5
    fallback:
      - {provider: anthropic, model: claude-sonnet-4}
      - {provider: google, model: gemini-3-pro}

  # Shared fallback pool — tried after per-member fallbacks are exhausted
  fallback_pool:
    - {provider: openai, model: gpt-5-mini}
    - {provider: anthropic, model: claude-haiku}
    - {provider: google, model: gemini-3-flash}
    - {provider: openrouter, model: anthropic/claude-sonnet-4}

  # Operational settings
  quorum_min: 2                # Minimum members for valid deliberation
  max_revise_loops: 4          # REVISE bounce cap before escalation
  timeout_seconds: 600         # Total council timeout
  member_timeout_seconds: 180  # Per-member timeout
  token_cap: 200000            # Total token budget (null to disable)

  # Optional features
  adaptive_stopping: false     # KS statistic early stopping (debate only)
  scan_context: true           # Scan workspace files for question framing


