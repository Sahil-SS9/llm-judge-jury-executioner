# Example LLM Judge Jury Executioner configuration
# Replace every `your-*` model placeholder with a model ID available from
# providers you already use. Keep API keys in environment variables.
#
# Supported credential variables:
#   OPENAI_API_KEY
#   ANTHROPIC_API_KEY       # only if you deliberately use that provider
#   GOOGLE_API_KEY
#   OPENROUTER_API_KEY
#   CUSTOM_API_KEY + CUSTOM_BASE_URL

council:
  panel_size: 3
  protocol: deliberate  # deliberate|vote|synthesize|critique|redteam|mav

  # Optional phases used only when they belong to the selected protocol.
  compose: true
  cross_examination: true
  cascade_breaker: true
  minority_report: true
  html_report: true
  evidence_labels: true

  # Use different models/providers where possible. These are placeholders,
  # not recommendations or guaranteed provider catalogue IDs.
  panel:
    - provider: openai
      model: your-openai-model
      fallback:
        - {provider: openrouter, model: your-openrouter-fallback}

    - provider: google
      model: your-google-model
      fallback:
        - {provider: openai, model: your-openai-fallback}

    - provider: openrouter
      model: your-openrouter-model
      fallback:
        - {provider: google, model: your-google-fallback}

  chairman:
    provider: openai
    model: your-chairman-model
    fallback:
      - {provider: google, model: your-google-fallback}
      - {provider: openrouter, model: your-openrouter-fallback}

  fallback_pool:
    - {provider: openrouter, model: your-shared-fallback}

  quorum_min: 2
  timeout_seconds: 600
  member_timeout_seconds: 180
  token_cap: 200000  # null disables the cap

  # `deliberate` can skip ranking when initial/revised confidence converges.
  adaptive_stopping: false

  # Reads only AGENTS.md, CLAUDE.md, README.md and pyproject.toml from one root.
  scan_context: true
  context_root: ""          # empty = current working directory
  context_max_chars: 16000
